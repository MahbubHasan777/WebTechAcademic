<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>University Admission Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 20px;
        }

        form {
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            margin: auto;
        }

        fieldset {
            border: 1px solid #ddd;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 5px;
        }

        legend {
            font-weight: bold;
            color: #333;
            padding: 0 10px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input[type="text"],
        input[type="email"],
        input[type="date"],
        select {
            width: 100%;
            padding: 8px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        .radio-group,
        .checkbox-group {
            margin-bottom: 15px;
        }

        .radio-group label,
        .checkbox-group label {
            display: inline;
            font-weight: normal;
            margin-right: 15px;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }

        button[type="submit"] {
            background-color: #28a745;
            color: white;
        }

        button[type="reset"] {
            background-color: #dc3545;
            color: white;
            margin-left: 10px;
        }
    </style>
</head>

<body>

    <h1 style="text-align: center;">University Admission Form</h1>

    <form action="#" method="post" enctype="multipart/form-data">

        <fieldset>
            <legend>Personal Information</legend>

            <label for="fullname">Full Name:</label>
            <input type="text" id="fullname" name="fullname" required maxlength="50" placeholder="Enter your full name">

            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email" required placeholder="example@email.com">

            <label>Gender:</label>
            <div class="radio-group">
                <input type="radio" id="male" name="gender" value="male" required>
                <label for="male">Male</label>

                <input type="radio" id="female" name="gender" value="female">
                <label for="female">Female</label>

                <input type="radio" id="other" name="gender" value="other">
                <label for="other">Other</label>
            </div>

            <label for="dob">Date of Birth:</label>
            <input type="date" id="dob" name="dob" required>
        </fieldset>

        <fieldset>
            <legend>Academic Information</legend>

            <label for="department">Preferred Department:</label>
            <select id="department" name="department" required>
                <option value="">Select Department</option>
                <option value="cse">Computer Science & Engineering</option>
                <option value="eee">Electrical & Electronic Engineering</option>
                <option value="bba">Business Administration</option>
                <option value="arch">Architecture</option>
            </select>

            <label>Interests:</label>
            <div class="checkbox-group">
                <input type="checkbox" id="coding" name="interests" value="coding">
                <label for="coding">Coding</label>

                <input type="checkbox" id="sports" name="interests" value="sports">
                <label for="sports">Sports</label>

                <input type="checkbox" id="music" name="interests" value="music">
                <label for="music">Music</label>

                <input type="checkbox" id="research" name="interests" value="research">
                <label for="research">Research</label>
            </div>

            <label for="documents">Upload Documents (Resume/Transcript):</label>
            <input type="file" id="documents" name="documents" accept=".pdf,.doc,.docx,.jpg,.png">
        </fieldset>

        <div style="text-align: center;">
            <button type="submit">Submit Application</button>
            <button type="reset">Reset Form</button>
        </div>

    </form>

</body>

</html>
